[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nasdaq100"
version = "0.1.0"
description = "AI-Driven Equity Research & Portfolio Decision Support System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Equity Research Team" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "shap>=0.42.0",
    "plotly>=5.15.0",
    "streamlit>=1.28.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "joblib>=1.3.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0"
]
notebooks = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.25.0"
]

[project.scripts]
nasdaq100 = "nasdaq100.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Fast isolated unit tests (no data required)",
    "leakage: Time-safety and data leakage tests",
    "integration: Small end-to-end integration tests",
    "needs_data: Tests that require the real frozen raw dataset",
    "slow: Tests with extensive computation or large simulation grids"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP"   # pyupgrade
]
ignore = [
    "E501" # line length handled by formatter
]
